

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, F1, exec, ~/.local/lib/hyde/wallpaper.sh --select
bind = $mainMod, F2, exec, ~/.local/lib/hyde/theme.select.sh
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = , F7, fullscreen, 0

# Volumen
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brillo
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Rofi
bind = $mainMod, space, exec, ~/.local/lib/hyde/rofilaunch.sh

# Cambiar workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Mover ventana al workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

input {
    kb_layout = es
}

bind = $mainMod, L, exec, hyprlock

bind = $mainMod, G, exec, ~/.local/lib/hyde/gamelauncher.sh

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

monitor = HDMI-A-1, 3840x2160@60, auto, 1.5

bindl = , switch:on:Lid Switch, exec, hyprlock
# exec-once = nwg-dock-hyprland -i 24 -p bottom -d -mb 0 -hd 100

exec-once = swayidle -w timeout 10800 'systemctl poweroff'
